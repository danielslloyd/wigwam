name: Build video lists

# Reads every wigwam from Supabase, fetches YouTube, and writes each wigwam's private
# files to Supabase storage. Runs nightly, and whenever a grown-up publishes (the
# admin page asks the request-build function, which starts this workflow).

on:
  schedule:
    - cron: '0 5 * * 1-6'   # daily incremental update
    - cron: '0 5 * * 0'     # weekly full rebuild (drops deleted videos)
  workflow_dispatch:
    inputs:
      full:
        description: 'Full rebuild'
        type: boolean
        default: false

permissions:
  contents: read

# Runs queue up instead of overlapping; a newer request replaces one still waiting.
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: node scripts/build-catalog.mjs ${{ (github.event.schedule == '0 5 * * 0' || inputs.full) && '--full' || '' }}
